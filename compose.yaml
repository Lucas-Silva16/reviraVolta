name: reviravolta
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviravolta_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup}
      POSTGRES_DB: reviravolta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_connections=off", "-c", "log_disconnections=off", "-c", "log_parameter_max_length_on_error=0"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviravolta_owner -d reviravolta"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
